name: dart-tracking

# caps each container's json-file log at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TRACKER_VERSION: ${TRACKER_VERSION:-}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing in .env}

      JWT_SECRET: ${JWT_SECRET:?missing in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?missing in .env}
      COOKIE_SECURE: true
      CORS_ORIGINS: "[]" # nginx serves the app and /api under one origin, so nothing here is ever cross-origin
      FORWARDED_ALLOW_IPS: "172.16.0.0/12" # trust nginx's X-Forwarded-For on the compose network

      SMTP_HOST: ${SMTP_HOST:?missing in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_FROM: ${MAIL_FROM:?missing in .env}
      APP_URL: ${APP_URL:?missing in .env}

      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      garage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - speech_data:/app/speech # announcer phrases with player names, voiced on demand

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-}
        PRIMEUI_LICENSE_KEY: ${PRIMEUI_LICENSE_KEY:-}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:10020:8080" # only cloudflared on the host connects

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?missing in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 store for the kept camera frames, see s3/.
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    logging: *logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    volumes:
      - ./s3/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # Lays out the node, brings in the bucket and the backend's key and moves the frames still on disk into the bucket, then exits.
  garage-init:
    build: ./s3
    restart: "no"
    logging: *logging
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      MOVE_FRAMES_FROM: /frames
    volumes:
      - ${TESTDATA_DIR:-./backend/testdata}/evaluation:/frames
    depends_on:
      - garage

volumes:
  postgres_data:
  redis_data:
  speech_data:
  garage_meta:
  garage_data:
