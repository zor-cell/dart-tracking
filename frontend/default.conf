map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # use angular routing on page misses
        try_files $uri $uri/ /index.html;
    }

    # The entry point names the content-hashed bundles, so a cached copy pins the
    # browser to whatever build it was fetched with. Must be revalidated.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Hashed filenames: a given URL never changes what it returns.
    location ~* \.(?:js|css|woff2?)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # custom timeouts for idle connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}