@if (opener) {
  <p-button
    [label]="shownLabel()"
    icon="pi pi-arrow-left"
    severity="secondary"
    [text]="true"
    (onClick)="back()"
  />
} @else {
  <p-button
    [label]="shownLabel()"
    icon="pi pi-arrow-left"
    severity="secondary"
    [text]="true"
    [routerLink]="link()"
  />
}
