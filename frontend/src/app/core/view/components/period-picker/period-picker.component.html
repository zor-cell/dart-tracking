<p-popover>
  <div class="period">
    @if (units()) {
      <span id="period-unit" class="sr-only">Zeitraum zählen in</span>
      <p-selectbutton
        [options]="unitOptions"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        [ngModel]="unit()"
        (ngModelChange)="selectUnit($event)"
        ariaLabelledBy="period-unit"
        size="small"
        fluid
      />
    }
    <span id="period-pick" class="sr-only">Zeitraum</span>
    <p-selectbutton
      [options]="periodOptions()"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="period()"
      (ngModelChange)="selectPeriod($event)"
      ariaLabelledBy="period-pick"
      size="small"
      fluid
    >
      <ng-template #item let-option>
        @if (option.value === 'custom') {
          <i class="pi pi-calendar" aria-hidden="true"></i>
          <span class="sr-only">{{ option.label }}</span>
        } @else {
          {{ option.label }}
        }
      </ng-template>
    </p-selectbutton>
    @if (period() === 'custom') {
      <p-datepicker
        [ngModel]="range()"
        (ngModelChange)="pickRange($event)"
        selectionMode="range"
        [inline]="true"
        ariaLabel="Eigener Zeitraum"
      />
    }
  </div>
</p-popover>
