<div
  class="sortable"
  [class.sortable--bordered]="bordered()"
  cdkDropList
  cdkDropListLockAxis="y"
  (cdkDropListDropped)="drop($event)"
>
  @for (item of items(); track item; let index = $index) {
    <div
      class="sortable__row"
      cdkDrag
      cdkDragPreviewContainer="parent"
      (cdkDragStarted)="started($event)"
    >
      <div
        *cdkDragPreview
        class="sortable__row sortable__preview"
        [style.height.px]="placeholderHeight()"
      >
        <i class="pi pi-bars sortable__preview-grip" aria-hidden="true"></i>
        <span class="sortable__preview-label">{{ label()(item, index) }}</span>
      </div>
      <div
        *cdkDragPlaceholder
        class="sortable__placeholder"
        [style.height.px]="placeholderHeight()"
      ></div>
      <button
        type="button"
        class="sortable__grip"
        cdkDragHandle
        [attr.aria-label]="label()(item, index) + ' verschieben, Pfeiltasten hoch und runter'"
        (keydown.arrowup)="step($event, index, -1)"
        (keydown.arrowdown)="step($event, index, 1)"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <ng-container *ngTemplateOutlet="row(); context: { $implicit: item, index }" />
    </div>
  }
</div>
