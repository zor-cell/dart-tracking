<label class="list-filters__label" [for]="inputId()">{{ label() }}</label>
<p-select
  [inputId]="inputId()"
  [formControl]="control()"
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [filter]="searchLabel() !== null"
  [filterPlaceholder]="searchLabel() ?? ''"
  [showClear]="true"
  [multiple]="true"
  [checkmark]="true"
  fluid
>
  <ng-template #selectedItem>{{ pickedLabel() }}</ng-template>
</p-select>
