<p class="panel__hint trend__legend">
  <button
    type="button"
    class="legend-toggle"
    [class.legend-toggle--off]="hidden().has('games')"
    [attr.aria-pressed]="!hidden().has('games')"
    (click)="toggle('games')"
  >
    <span class="trend__dot"></span
    ><ng-container i18n="@@stats.trend.games">Einzelne Spiele</ng-container>
  </button>
  <span class="trend__entry">
    <button
      type="button"
      class="legend-toggle"
      [class.legend-toggle--off]="hidden().has('trend')"
      [attr.aria-pressed]="!hidden().has('trend')"
      (click)="toggle('trend')"
    >
      <span class="trend__line"></span><ng-container i18n="@@stats.tab.trend">Trend</ng-container>
    </button>
    <app-info-hint>
      <ng-container i18n="@@eval.trend.hint"
        >Anteil korrekt gewerteter Darts über die letzten {{ window }} Spiele.</ng-container
      >
    </app-info-hint>
  </span>
</p>
<p-chart type="line" height="13rem" [data]="data()" [options]="options()" [ariaLabel]="ariaLabel()" />
