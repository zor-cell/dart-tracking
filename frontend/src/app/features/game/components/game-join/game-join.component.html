<section class="view">
  @if (failed()) {
    <div class="placeholder">
      <i class="pi pi-link placeholder__icon" aria-hidden="true"></i>
      <p>Dieses Spiel gibt es nicht mehr.</p>
      <p class="join__hint">
        Der Link ist abgelaufen — vielleicht wurde das Spiel beendet oder der Server neu gestartet.
      </p>
      <p-button label="Neues Spiel" icon="pi pi-play-circle" routerLink="/game/new" />
    </div>
  } @else {
    <div class="placeholder" role="status">
      <p-progress-spinner ariaLabel="Spiel wird geladen" [style]="{ width: '2.5rem', height: '2.5rem' }" />
      <p>Spiel wird beigetreten …</p>
    </div>
  }
</section>
