<section class="view">
  @switch (status()) {
    @case ('resolving') {
      <app-loading-state label="Spiel wird beigetreten" />
    }
    @case ('choosing') {
      <div class="join">
        <h2 class="join__title">Spiel beitreten</h2>
        <p class="join__summary">{{ summary() }}</p>

        <div class="join__options">
          <p-button
            fluid
            label="Mit Kamera"
            icon="pi pi-camera"
            (onClick)="enter('camera')"
          />
          <p-button
            fluid
            label="Ohne Kamera"
            icon="pi pi-chart-pie"
            severity="secondary"
            [outlined]="true"
            (onClick)="enter('scoreboard')"
          />
        </div>
      </div>
    }
    @case ('failed') {
      <app-empty-state icon="pi-link">
        <p>Dieses Spiel gibt es nicht mehr.</p>
        <p class="join__hint">
          Der Link ist abgelaufen — vielleicht wurde das Spiel beendet oder der Server neu gestartet.
        </p>
        <p-button label="Neues Spiel" icon="pi pi-play-circle" routerLink="/game/new" />
      </app-empty-state>
    }
  }
</section>
