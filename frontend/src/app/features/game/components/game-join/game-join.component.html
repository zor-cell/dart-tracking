<section class="view">
  @if (failed()) {
    <app-empty-state icon="pi-link">
      <p i18n="@@game.join.gone">Dieses Spiel gibt es nicht mehr.</p>
      <p class="empty-state__hint" i18n="@@game.join.goneHint">
        Der Link ist abgelaufen — vielleicht wurde das Spiel beendet oder der Server neu gestartet.
      </p>
      <p-button
        label="Neues Spiel"
        i18n-label="@@start.newGame"
        icon="pi pi-play-circle"
        routerLink="/game/new"
      />
    </app-empty-state>
  } @else {
    <app-loading-state label="Spiel wird beigetreten" i18n-label="@@game.join.loading" />
  }
</section>
