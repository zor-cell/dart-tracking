<svg class="heatmap" [attr.viewBox]="viewBox" role="img" [attr.aria-label]="ariaLabel()">
  <g app-board-face></g>

  @for (mark of marks(); track $index) {
    <circle class="heatmap__mark" [attr.cx]="mark.x" [attr.cy]="mark.y" [attr.r]="markRadius" />
  }

  <g app-dart-markers [darts]="current()" [radius]="markRadius"></g>
</svg>
