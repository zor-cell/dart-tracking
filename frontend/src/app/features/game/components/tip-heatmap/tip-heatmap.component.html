<svg
  class="heatmap"
  [attr.viewBox]="viewBox"
  [attr.role]="counts() === null ? 'img' : 'group'"
  [attr.aria-label]="ariaLabel()"
  (click)="onBoardClick($event)"
>
  <g
    app-board-face
    [faded]="true"
    [interactive]="counts() !== null"
    (fieldEnter)="onFieldEnter($event)"
    (fieldLeave)="hovered.set(null)"
  >
    @if (cloud(); as cloud) {
      <image
        class="heatmap__cloud"
        [attr.href]="cloud"
        [attr.x]="-extent"
        [attr.y]="-extent"
        [attr.width]="extent * 2"
        [attr.height]="extent * 2"
        preserveAspectRatio="none"
      />
    }
  </g>

  @for (field of fields(); track field.label) {
    <path
      class="heatmap__field"
      [attr.d]="field.d"
      tabindex="0"
      role="button"
      [attr.aria-label]="field.ariaLabel"
      [attr.aria-pressed]="pinned() === field.label"
      (focus)="pinned.set(field.label)"
    />
  }

  @if (!cloud()) {
    @for (dot of dots(); track $index) {
      <circle class="heatmap__mark" [attr.cx]="dot.x" [attr.cy]="dot.y" [attr.r]="markRadius" />
    }
    @for (arrow of arrows(); track $index) {
      <path class="heatmap__mark" [attr.d]="arrowPath" [attr.transform]="arrow" />
    }
  }

  <g app-dart-markers [darts]="current()" [radius]="markRadius"></g>

  <ng-content select="[overlay]" />

  @if (selected(); as field) {
    <path class="heatmap__selected heatmap__selected--halo" [attr.d]="field.outline" />
    <path class="heatmap__selected" [attr.d]="field.outline" />
  }
</svg>

<p class="caption" aria-live="polite">
  @if (pick(); as pick) {
    <strong>{{ pick.name }}</strong> &middot; {{ pick.detail }}
  } @else {
    <span class="caption__summary">{{ caption() }}</span>
  }
</p>
@if (density(); as density) {
  <app-heat-legend class="legend" [color]="legendColor">
    <span>{{ density.peak | number: '1.0-1' }} Darts/cm²</span>
  </app-heat-legend>
}
