@if (game.state(); as state) {
  <header class="top-bar">
    <div class="top-bar__heading">
      <span class="top-bar__title">{{ title() }}</span>
      <app-announcer-toggle />
      <app-torch-toggle />
    </div>

    <div class="top-bar__actions">      <p-button
        icon="pi pi-share-alt"
        severity="secondary"
        size="small"
        ariaLabel="Spiel teilen"
        (onClick)="openShareDialog()"
      />
      <p-button
        icon="pi pi-sign-out"
        severity="danger"
        outlined
        size="small"
        ariaLabel="Spiel beenden"
        (onClick)="confirmEndGame()"
      />
    </div>
  </header>

  <!-- The QR encoder is a chunk of its own, and this dialog is opened once a
       game at most — so it is kept out of the initial bundle and fetched while
       the app is idle, which makes the tap itself instant anyway. -->
  @defer (when shareDialogVisible(); prefetch on idle) {
  <p-dialog
    header="Spiel teilen"
    [modal]="true"
    [draggable]="false"
    [(visible)]="shareDialogVisible"
    [style]="{ width: '30rem', maxWidth: '92vw' }"
    [focusOnShow]="false"
    appendTo="body"
  >
    <div class="share">
      <p class="share__hint">
          Scanne den QR-Code damit du den Spielstand auf einem anderen Gerät sehen kannst
      </p>

      <!-- White backdrop regardless of theme: a dark-on-dark QR does not scan. -->
      <div class="share__code">
        <qrcode [qrdata]="shareUrl()" [width]="220" [margin]="1" errorCorrectionLevel="M"
                alt="QR-Code zum Beitreten" />
      </div>

      <p-divider class="share__divider" align="center">
        <span class="share__divider-label">oder kopiere den Code</span>
      </p-divider>

      <div class="share__link">
        <input
          pInputText
          readonly
          class="share__link-input"
          [value]="shareUrl()"
          aria-label="Einladungslink"
          (focus)="selectLink($event)"
        />
        <p-button
          icon="pi pi-copy"
          severity="secondary"
          ariaLabel="Link kopieren"
          (onClick)="copyLink()"
        />
      </div>
    </div>
  </p-dialog>
  }

  <p-confirmdialog />
}
