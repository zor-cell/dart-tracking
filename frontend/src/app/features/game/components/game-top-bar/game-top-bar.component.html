@if (game.state(); as state) {
  <header class="top-bar">
    <span class="top-bar__title">{{ state.mode }}</span>

    <div class="top-bar__actions">
      <p-button
        icon="pi pi-share-alt"
        severity="secondary"
        size="small"
        (onClick)="share()"
      />
      <p-button
        icon="pi pi-sign-out"
        severity="danger"
        outlined
        size="small"
        (onClick)="confirmEndGame()"
      />
    </div>
  </header>

  <p-confirmdialog />
}
