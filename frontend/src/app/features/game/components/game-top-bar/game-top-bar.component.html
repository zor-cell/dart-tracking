@if (game.state(); as state) {
  <header class="top-bar">
    <div class="top-bar__heading">
      <div class="top-bar__actions">
        <p-button
          icon="pi pi-times"
          severity="secondary"
          [outlined]="true"
          size="small"
          ariaLabel="Spiel verlassen"
          i18n-ariaLabel="@@game.leave"
          (onClick)="confirmLeaveGame()"
        />
        @if (state.settings.variant === 'training' && !state.ended) {
          <p-button
            icon="pi pi-flag"
            severity="secondary"
            [outlined]="true"
            size="small"
            ariaLabel="Training beenden"
            i18n-ariaLabel="@@game.endTraining"
            (onClick)="confirmEndTraining()"
          />
        }
      </div>
      <span class="top-bar__title">{{ title() }}</span>
    </div>

    <div class="top-bar__actions">
      <app-torch-toggle />
      <app-announcer-toggle />
      <p-button
        icon="pi pi-share-alt"
        severity="secondary"
        size="small"
        ariaLabel="Spiel teilen"
        i18n-ariaLabel="@@game.share"
        (onClick)="openShareDialog()"
      />
    </div>
  </header>

  @defer (when shareDialogVisible(); prefetch on idle) {
    <app-share-dialog
      header="Spiel teilen"
      i18n-header="@@game.share"
      hint="Scanne den QR-Code damit du den Spielstand auf einem anderen Gerät sehen kannst"
      i18n-hint="@@game.shareHint"
      shareText="Komm in mein Dart-Spiel:"
      i18n-shareText="@@game.shareText"
      qrAlt="QR-Code zum Beitreten"
      i18n-qrAlt="@@game.shareQrAlt"
      [url]="shareUrl()"
      [(visible)]="shareDialogVisible"
    />
  }
}
