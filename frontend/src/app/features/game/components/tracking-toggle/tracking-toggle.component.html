@if (shown()) {
  <p-button
    [icon]="paused() ? 'pi pi-play-circle' : 'pi pi-pause-circle'"
    [severity]="paused() ? 'primary' : 'secondary'"
    [outlined]="!paused()"
    size="small"
    [ariaLabel]="paused() ? resumeLabel : pauseLabel"
    [attr.aria-pressed]="paused()"
    (onClick)="onClick()"
  />
}
