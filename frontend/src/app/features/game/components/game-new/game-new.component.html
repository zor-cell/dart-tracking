<section class="view">
  <header class="view__header">
    <h1 class="view__title">Neues Spiel</h1>
    <p class="view__subtitle">Spieler und Modus wählen</p>
  </header>

  <form class="setup" [formGroup]="form" (ngSubmit)="startGame()">
    <div class="setup__field">
      <label class="setup__label" for="variant">Variante</label>
      <p-selectbutton
        inputId="variant"
        formControlName="variant"
        [allowEmpty]="false"
        [options]="variantOptions"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="setup__field">
      <label class="setup__label" for="mode">Modus</label>
      <p-selectbutton
        inputId="mode"
        formControlName="mode"
        [allowEmpty]="false"
        [options]="modeOptions"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="setup__field">
      <label class="setup__label" for="checkoutMode">Checkout</label>
      <p-selectbutton
        inputId="checkoutMode"
        formControlName="checkoutMode"
        [allowEmpty]="false"
        [options]="checkoutModeOptions"
        optionLabel="label"
        optionValue="value"
      />
    </div>

    <div class="setup__field">
      <span class="setup__label">Spieler</span>
      @if (sessionResolved()) {
        <div
          class="setup__players"
          cdkDropList
          cdkDropListLockAxis="y"
          (cdkDropListDropped)="dropSeat($event)"
        >
          @for (seat of seats.controls; track seat) {
            <div class="setup__player" cdkDrag cdkDragPreviewContainer="parent">
              <button
                type="button"
                class="setup__grip"
                cdkDragHandle
                [attr.aria-label]="'Spieler ' + ($index + 1) + ' verschieben, Pfeiltasten hoch und runter'"
                (keydown.arrowup)="stepSeat($event, $index, -1)"
                (keydown.arrowdown)="stepSeat($event, $index, 1)"
              >
                <i class="pi pi-bars" aria-hidden="true"></i>
              </button>
              @if (signedIn()) {
                <p-autocomplete
                  class="setup__input"
                  [formControl]="seat"
                  [suggestions]="suggestions()"
                  (completeMethod)="completeSeat($event)"
                  optionLabel="name"
                  appendTo="body"
                  [dropdown]="true"
                  [showEmptyMessage]="false"
                  [ariaLabel]="'Spieler ' + ($index + 1)"
                  placeholder="Name wählen oder eintippen"
                  fluid
                >
                  <ng-template #item let-identity>
                    <span>{{ identity.name }}</span>
                    @if (identity.isSelf) {
                      <span class="setup__self">du</span>
                    }
                  </ng-template>
                </p-autocomplete>
              } @else {
                <input
                  pInputText
                  class="setup__input"
                  [formControl]="seat"
                  [attr.aria-label]="'Spieler ' + ($index + 1)"
                  placeholder="Name"
                />
              }
              <p-button
                type="button"
                icon="pi pi-trash"
                severity="secondary"
                [text]="true"
                [disabled]="seats.length <= 1"
                [ariaLabel]="'Spieler ' + ($index + 1) + ' entfernen'"
                (onClick)="removePlayer($index)"
              />
            </div>
          }
        </div>
        <p-button
          type="button"
          label="Spieler hinzufügen"
          icon="pi pi-plus"
          severity="secondary"
          [text]="true"
          (onClick)="addPlayer()"
        />
      } @else {
        <!-- Placeholder seats while the address book answers, so the form does not jump. -->
        @for (row of skeletonSeats; track $index) {
          <div class="setup__player">
            <p-skeleton width="1.5rem" [height]="seatRowHeight" />
            <p-skeleton class="setup__input" [height]="seatRowHeight" />
            <p-skeleton width="2.5rem" [height]="seatRowHeight" />
          </div>
        }
        <p-skeleton width="11.5rem" [height]="seatRowHeight" />
      }
    </div>

    <p-button
      type="submit"
      fluid
      label="Spiel starten"
      icon="pi pi-play"
      [disabled]="form.invalid"
    />
  </form>
</section>
