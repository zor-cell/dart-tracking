<app-heat-board
  [fields]="fields()"
  [ariaLabel]="ariaLabel()"
  [legendMax]="total() > 0 ? '' + most() : null"
  [(selected)]="pinned"
  [(hovered)]="hovered"
>
  <svg:g overlay app-field-frames [darts]="current()" [includeLocated]="true"></svg:g>

  <p caption class="caption">
    @if (selected(); as field) {
      <strong>{{ field.name }}</strong> &middot;
      @if (field.count === 0) {
        {{ field.label === miss ? 'keine Darts' : 'keine Treffer' }}
      } @else {
        {{ field.count }} {{ field.count === 1 ? 'Dart' : 'Darts' }} &middot;
        {{ field.share | number: '1.0-0' }}&nbsp;%
      }
    } @else {
      <span class="caption__summary">{{ total() }} Darts</span>
    }
  </p>

  <button
    corner
    type="button"
    class="miss"
    [class.miss--selected]="selected()?.label === miss"
    [attr.aria-pressed]="selected()?.label === miss"
    [attr.aria-label]="'Daneben: ' + misses() + (misses() === 1 ? ' Dart' : ' Darts')"
    (click)="toggleMiss()"
    (pointerenter)="onMissEnter($event)"
    (pointerleave)="hovered.set(null)"
  >
    <span class="miss__swatch" [style.border-color]="missOrdinals()[0]?.color">
      <span class="miss__fill" [style.opacity]="missOpacity()"></span>
    </span>
    Daneben
    @for (ordinal of missOrdinals(); track ordinal.value) {
      <span class="miss__ordinal" [style.color]="ordinal.color">{{ ordinal.value }}</span>
    }
  </button>
</app-heat-board>
