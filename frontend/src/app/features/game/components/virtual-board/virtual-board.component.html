<svg class="board" [attr.viewBox]="viewBox" role="img" [attr.aria-label]="ariaLabel()">
  <g app-board-face></g>

  @if (calibration() === 'calibrated' || calibration() === 'calibrating') {
    <circle
      class="board__ring"
      [class.board__ring--pulsing]="calibration() === 'calibrating'"
      cx="0"
      cy="0"
      [attr.r]="ringRadius"
    />
  }

  <g app-field-frames [darts]="darts()"></g>
  <g app-dart-markers [darts]="darts()" [shadowDarts]="shadowDarts()"></g>
</svg>
