<svg class="board" [attr.viewBox]="viewBox" role="img" [attr.aria-label]="ariaLabel()">
  <circle class="board__backing" cx="0" cy="0" [attr.r]="backingRadius" />

  @for (segment of segments; track $index) {
    <path class="board__segment board__segment--{{ segment.tone }}" [attr.d]="segment.d" />
  }

  <circle class="board__segment board__segment--green" cx="0" cy="0" [attr.r]="bullRadius" />
  <circle class="board__segment board__segment--red" cx="0" cy="0" [attr.r]="bullseyeRadius" />

  @for (number of sectorNumbers; track number.value) {
    <text class="board__number" [attr.x]="number.x" [attr.y]="number.y">{{ number.value }}</text>
  }

  <!-- Coloured by position in the visit, the same order the camera outlines the
       darts in, so one throw is one colour on both screens. -->
  @for (marker of markers(); track $index) {
    <g class="board__marker">
      @if (marker.arrowTransform === null) {
        <circle [attr.cx]="marker.x" [attr.cy]="marker.y" [attr.r]="markerRadius" [attr.fill]="marker.color" />
      } @else {
        <path [attr.d]="arrowPath" [attr.fill]="marker.color" [attr.transform]="marker.arrowTransform" />
      }
      <text
        [class.board__marker--aimed]="marker.arrowTransform !== null"
        [attr.x]="marker.labelX"
        [attr.y]="marker.labelY"
        [attr.fill]="marker.color"
      >
        {{ marker.ordinal }}
      </text>
    </g>
  }
</svg>
