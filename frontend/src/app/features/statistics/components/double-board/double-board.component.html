<app-heat-board
  [fields]="fields()"
  ariaLabel="Doppel nach Trefferquote"
  fill="var(--p-green-500)"
  [scale]="scale"
  [selectable]="selectable"
  [legendMax]="legendMax()"
  [(selected)]="selected"
  [(hovered)]="hovered"
>
  <p caption class="caption">
    @if (shown(); as double) {
      <strong>{{ double.name }}</strong> &middot; {{ double.hits }} von
      {{ double.attempts }} getroffen &middot; {{ double.rate * 100 | number: '1.0-0' }}&nbsp;%
    } @else {
      <span class="caption__summary">{{ attempts() }} Darts auf Doppel</span>
    }
  </p>
</app-heat-board>
