<section class="panel">
  <h2 class="panel__title">Deine Visits</h2>
  <p-chart
    class="visits__chart"
    type="bar"
    height="13rem"
    [data]="data()"
    [options]="options()"
    [plugins]="plugins"
    [ariaLabel]="ariaLabel()"
  />
  <div class="readout">
    <p-button
      icon="pi pi-angle-left"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      ariaLabel="Einen Punkt weniger"
      [disabled]="selected() === 0"
      (onClick)="step(-1)"
    />
    @let count = counts()[selected()];
    <p class="readout__value" aria-live="polite">
      <strong>{{ selected() }}</strong> &middot; {{ count }} {{ count === 1 ? 'Visit' : 'Visits' }}
    </p>
    <p-button
      icon="pi pi-angle-right"
      severity="secondary"
      [text]="true"
      [rounded]="true"
      ariaLabel="Einen Punkt mehr"
      [disabled]="selected() === maxVisit"
      (onClick)="step(1)"
    />
  </div>
  <p class="panel__hint">Am häufigsten geworfen:</p>
  <ul class="visits">
    @for (entry of top(); track entry.score) {
      <li>
        <button
          type="button"
          class="visits__chip"
          [class.visits__chip--picked]="entry.score === selected()"
          [attr.aria-pressed]="entry.score === selected()"
          (click)="selected.set(entry.score)"
        >
          <strong>{{ entry.score }}</strong> &times; {{ entry.count }}
        </button>
      </li>
    }
  </ul>
</section>
