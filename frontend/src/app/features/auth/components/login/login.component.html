<section class="view">
  <header class="view__header">
    <h1 class="view__title">Anmelden</h1>
  </header>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-form__field">
      <label class="auth-form__label" for="identifier">E-Mail oder Benutzername</label>
      <input
        pInputText
        id="identifier"
        formControlName="identifier"
        aria-describedby="identifier-error"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        fluid
      />
      <app-field-error id="identifier-error" [control]="form.controls.identifier" />
    </div>

    <div class="auth-form__field">
      <label class="auth-form__label" for="password">Passwort</label>
      <input
        pInputText
        id="password"
        type="password"
        formControlName="password"
        aria-describedby="password-error"
        autocomplete="current-password"
        fluid
      />
      <app-field-error id="password-error" [control]="form.controls.password" />
    </div>

    @if (error(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <p-button
      type="submit"
      fluid
      label="Anmelden"
      icon="pi pi-sign-in"
      [loading]="busy()"
      [disabled]="form.invalid"
    />
  </form>

  <div class="auth-switch">
    <p>Noch kein Konto? <a routerLink="/register" queryParamsHandling="preserve">Registrieren</a></p>
    <a routerLink="/forgot-password">Passwort vergessen?</a>
  </div>
</section>
