<section class="view">
  <header class="view__header">
    <h1 class="view__title" i18n="@@auth.newPassword">Neues Passwort</h1>
  </header>

  @if (done()) {
    <p-message
      severity="success"
      text="Dein Passwort ist geändert. Auf allen Geräten musst du dich neu anmelden."
      i18n-text="@@auth.resetPassword.done"
    />
    <div class="view__actions">
      <p-button
        fluid
        label="Anmelden"
        i18n-label="@@auth.signIn"
        icon="pi pi-sign-in"
        routerLink="/login"
      />
    </div>
  } @else if (linkInvalid()) {
    <app-empty-state icon="pi-link">
      <p i18n="@@auth.linkInvalid">Der Link ist ungültig oder abgelaufen.</p>
      <p-button
        label="Neuen Link anfordern"
        i18n-label="@@auth.resetPassword.newLink"
        icon="pi pi-envelope"
        routerLink="/forgot-password"
      />
    </app-empty-state>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-form__field">
        <label class="auth-form__label" for="password" i18n="@@auth.newPassword">Neues Passwort</label>
        <input
          pInputText
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          aria-describedby="password-hint password-error"
          fluid
        />
        <small class="auth-form__hint" id="password-hint" i18n="@@auth.passwordHint">Mindestens 8 Zeichen.</small>
        <app-field-error id="password-error" [control]="form.controls.password" />
      </div>

      @if (error(); as message) {
        <p-message severity="error" [text]="message" />
      }

      <p-button
        type="submit"
        fluid
        label="Passwort speichern"
        i18n-label="@@auth.resetPassword.submit"
        icon="pi pi-check"
        [loading]="busy()"
        [disabled]="form.invalid"
      />
    </form>
  }
</section>
