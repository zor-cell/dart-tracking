<section class="view">
  <header class="view__header">
    <h1 class="view__title">Neues Passwort</h1>
  </header>

  @if (done()) {
    <p-message
      severity="success"
      text="Dein Passwort ist geändert. Auf allen Geräten musst du dich neu anmelden."
    />
    <div class="view__actions">
      <p-button fluid label="Anmelden" icon="pi pi-sign-in" routerLink="/login" />
    </div>
  } @else if (linkInvalid()) {
    <p-message severity="error" text="Der Link ist ungültig oder abgelaufen." />
    <div class="view__actions">
      <p-button fluid label="Neuen Link anfordern" icon="pi pi-envelope" routerLink="/forgot-password" />
    </div>
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-form__field">
        <label class="auth-form__label" for="password">Neues Passwort</label>
        <input
          pInputText
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          aria-describedby="password-hint"
          fluid
        />
        <small class="auth-form__hint" id="password-hint">Mindestens 8 Zeichen.</small>
      </div>

      @if (error(); as message) {
        <p-message severity="error" [text]="message" />
      }

      <p-button
        type="submit"
        fluid
        label="Passwort speichern"
        icon="pi pi-check"
        [loading]="busy()"
        [disabled]="form.invalid"
      />
    </form>
  }
</section>
