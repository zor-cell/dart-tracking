<section class="view">
  <header class="view__header">
    <app-back-link label="Anmelden" i18n-label="@@auth.signIn" link="/login" />
    <h1 class="view__title" i18n="@@auth.forgotPassword.title">Passwort vergessen</h1>
    <p class="view__subtitle" i18n="@@auth.forgotPassword.subtitle">
      Wir schicken dir einen Link zum Zurücksetzen
    </p>
  </header>

  @if (sent()) {
    <p-message
      severity="success"
      text="Falls ein Konto mit dieser Adresse existiert, ist eine Mail mit dem Link unterwegs. Er ist eine Stunde gültig."
      i18n-text="@@auth.forgotPassword.sent"
    />
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-form__field">
        <label class="auth-form__label" for="email" i18n="@@auth.email">E-Mail</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          aria-describedby="email-error"
          autocomplete="email"
          fluid
        />
        <app-field-error id="email-error" [control]="form.controls.email" />
      </div>

      @if (error(); as message) {
        <p-message severity="error" [text]="message" />
      }

      <p-button
        type="submit"
        fluid
        label="Link anfordern"
        i18n-label="@@auth.forgotPassword.submit"
        icon="pi pi-envelope"
        [loading]="busy()"
        [disabled]="form.invalid"
      />
    </form>
  }
</section>
