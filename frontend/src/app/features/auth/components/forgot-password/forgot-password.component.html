<section class="view">
  <header class="view__header">
    <app-back-link label="Anmelden" link="/login" />
    <h1 class="view__title">Passwort vergessen</h1>
    <p class="view__subtitle">Wir schicken dir einen Link zum Zurücksetzen</p>
  </header>

  @if (sent()) {
    <p-message
      severity="success"
      text="Falls ein Konto mit dieser Adresse existiert, ist eine Mail mit dem Link unterwegs. Er ist eine Stunde gültig."
    />
  } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="auth-form__field">
        <label class="auth-form__label" for="email">E-Mail</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" fluid />
      </div>

      @if (error(); as message) {
        <p-message severity="error" [text]="message" />
      }

      <p-button
        type="submit"
        fluid
        label="Link anfordern"
        icon="pi pi-envelope"
        [loading]="busy()"
        [disabled]="form.invalid"
      />
    </form>
  }
</section>
