<p-dialog
  header="Passwort ändern"
  [modal]="true"
  [draggable]="false"
  [(visible)]="visible"
  [style]="{ width: '24rem', maxWidth: '92vw' }"
  appendTo="body"
  (onHide)="reset()"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-form__field">
      <label class="auth-form__label" for="current-password">Aktuelles Passwort</label>
      <input
        pInputText
        id="current-password"
        type="password"
        formControlName="currentPassword"
        autocomplete="current-password"
        fluid
      />
    </div>

    <div class="auth-form__field">
      <label class="auth-form__label" for="new-password">Neues Passwort</label>
      <input
        pInputText
        id="new-password"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        aria-describedby="new-password-hint"
        fluid
      />
      <small class="auth-form__hint" id="new-password-hint">
        Mindestens 8 Zeichen. Andere Geräte werden dabei abgemeldet.
      </small>
    </div>

    @if (error(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <div class="auth-form__actions">
      <p-button
        type="button"
        label="Abbrechen"
        severity="secondary"
        [text]="true"
        [disabled]="busy()"
        (onClick)="visible.set(false)"
      />
      <p-button
        type="submit"
        label="Speichern"
        icon="pi pi-check"
        [loading]="busy()"
        [disabled]="form.invalid"
      />
    </div>
  </form>
</p-dialog>
