<p-dialog
  [header]="title()"
  [modal]="true"
  [draggable]="false"
  [(visible)]="visible"
  [style]="dialogStyle"
  appendTo="body"
  (onHide)="reset()"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    @if (viaGoogle()) {
      <app-google-confirm [(credential)]="googleCredential" />
    } @else {
      @if (!googleCredential()) {
        <div class="auth-form__field">
          <label class="auth-form__label" for="current-password" i18n="@@auth.currentPassword">
            Aktuelles Passwort
          </label>
          <input
            pInputText
            id="current-password"
            type="password"
            formControlName="currentPassword"
            aria-describedby="current-password-error"
            autocomplete="current-password"
            fluid
          />
          <app-field-error id="current-password-error" [control]="form.controls.currentPassword" />
        </div>
      }
      @if (googleLinked()) {
        <app-google-confirm [(credential)]="googleCredential" [alternative]="true" />
      }
    }

    @if (!unconfirmed()) {
      <div class="auth-form__field">
        <label class="auth-form__label" for="new-password" i18n="@@auth.newPassword">Neues Passwort</label>
        <input
          pInputText
          id="new-password"
          type="password"
          formControlName="newPassword"
          [pAutoFocus]="viaGoogle()"
          autocomplete="new-password"
          aria-describedby="new-password-hint new-password-error"
          fluid
        />
        <small class="auth-form__hint" id="new-password-hint" i18n="@@auth.changePassword.hint">
          Mindestens 8 Zeichen. Andere Geräte werden dabei abgemeldet.
        </small>
        <app-field-error id="new-password-error" [control]="form.controls.newPassword" />
      </div>
    }

    @if (error(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <div class="auth-form__actions">
      <p-button
        type="button"
        label="Abbrechen"
        i18n-label="@@common.cancel"
        severity="secondary"
        [text]="true"
        [disabled]="busy()"
        (onClick)="visible.set(false)"
      />
      @if (!unconfirmed()) {
        <p-button
          type="submit"
          label="Speichern"
          i18n-label="@@common.save"
          icon="pi pi-check"
          [loading]="busy()"
          [disabled]="form.invalid"
        />
      }
    </div>
  </form>
</p-dialog>
