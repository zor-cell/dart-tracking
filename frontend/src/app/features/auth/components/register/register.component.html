<section class="view">
  <header class="view__header">
    <h1 class="view__title" i18n="@@auth.register.title">Konto erstellen</h1>
  </header>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="auth-form__field">
      <label class="auth-form__label" for="email" i18n="@@auth.email">E-Mail</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        aria-describedby="email-error"
        autocomplete="email"
        fluid
      />
      <app-field-error id="email-error" [control]="form.controls.email" />
    </div>

    <div class="auth-form__field">
      <label class="auth-form__label" for="username" i18n="@@auth.username">Benutzername</label>
      <input
        pInputText
        id="username"
        formControlName="username"
        autocomplete="username"
        aria-describedby="username-hint username-error"
        fluid
      />
      <small class="auth-form__hint" id="username-hint" i18n="@@auth.register.usernameHint">
        3–32 Zeichen, Buchstaben, Ziffern, Punkt, Bindestrich oder Unterstrich.
      </small>
      <app-field-error
        id="username-error"
        [control]="form.controls.username"
        [messages]="usernameMessages"
      />
    </div>

    <div class="auth-form__field">
      <label class="auth-form__label" for="displayName" i18n="@@auth.displayName">Anzeigename</label>
      <input
        pInputText
        id="displayName"
        formControlName="displayName"
        autocomplete="nickname"
        aria-describedby="displayName-hint displayName-error"
        fluid
      />
      <small class="auth-form__hint" id="displayName-hint" i18n="@@auth.register.displayNameHint">
        So erscheinst du in der Spielerliste. Muss nicht eindeutig sein.
      </small>
      <app-field-error id="displayName-error" [control]="form.controls.displayName" />
    </div>

    <div class="auth-form__field">
      <label class="auth-form__label" for="password" i18n="@@auth.password">Passwort</label>
      <input
        pInputText
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        aria-describedby="password-hint password-error"
        fluid
      />
      <small class="auth-form__hint" id="password-hint" i18n="@@auth.passwordHint">Mindestens 8 Zeichen.</small>
      <app-field-error id="password-error" [control]="form.controls.password" />
    </div>

    @if (error(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <p-button
      type="submit"
      fluid
      label="Konto erstellen"
      i18n-label="@@auth.register.title"
      icon="pi pi-user-plus"
      [loading]="busy()"
      [disabled]="form.invalid"
    />
  </form>

  <app-google-sign-in text="signup_with" />

  <div class="auth-switch">
    <p i18n="@@auth.register.haveAccount">
      Schon ein Konto? <a routerLink="/login" queryParamsHandling="preserve">Anmelden</a>
    </p>
    <p i18n="@@auth.register.privacy">
      Was mit deinen Daten passiert, steht in der
      <a routerLink="/privacy" [state]="privacyBack">Datenschutzerklärung</a>.
    </p>
  </div>
</section>
