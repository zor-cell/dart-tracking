# Per client IP (after real_ip): API calls per second, sign-in attempts per minute, open sockets.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sockets:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    server_tokens off;

    # Only cloudflared on the host reaches this port; it names the client in CF-Connecting-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 @too_many_requests;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # use angular routing on page misses
        try_files $uri $uri/ /index.html;
    }

    # The entry point names the content-hashed bundles, so a cached copy pins the
    # browser to whatever build it was fetched with. Must be revalidated.
    location = /index.html {
        root   /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed filenames: a given URL never changes what it returns.
    location ~* \.(?:js|css|woff2?)$ {
        root   /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/snippets/proxy-headers.conf;

        limit_req zone=api burst=40 nodelay;
        client_max_body_size 64k;
    }

    location ~ ^/api/auth/(login|register|password-reset)$ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-headers.conf;

        limit_req zone=auth burst=5 nodelay;
        client_max_body_size 64k;
    }

    location /api/ws/ {
        proxy_pass http://backend:8000/api/ws/;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        limit_req zone=api burst=40 nodelay;
        limit_conn sockets 10;

        # custom timeouts for idle connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Same body shape as the backend's own errors, so the frontend reads both alike.
    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail":"too many requests"}';
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
