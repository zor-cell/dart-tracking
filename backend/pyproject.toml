[project]
name = "backend"
version = "1.0.0"
description = "Backend for automatic dart-tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # web
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.2",
    "websockets>=16.0",
    # computer vision
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.1",
    # persistence
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.0",
    # auth
    "pyjwt>=2.10.1",
    "pwdlib[argon2]>=0.2.1",
    "email-validator>=2.2.0",
    # config
    "pydantic-settings>=2.15.0",
    # mail
    "aiosmtplib>=5.1.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --import-mode=importlib"
timeout = 120
markers = [
    "cv_full: runs over the full photo set in TESTDATA_DIR",
    "dataset: replays photos from TESTDATA_DIR; the CV job runs these outside tests/cv",
]

[tool.coverage.run]
# SQLAlchemy's async engine runs through greenlets; without this, lines after an await go unseen.
concurrency = ["thread", "greenlet"]
source = ["app"]
