name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, rpi5]
    env:
      TESTDATA_DIR: /srv/dart-tracking/testdata
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tracker version counts commits over the whole history
      - name: Build and start the stack
        run: |
          # Tracker version: commits that changed the calibration or detection pipeline.
          TRACKER_VERSION=$(git rev-list --count HEAD -- \
            backend/src/app/api/features/calibration/domain \
            backend/src/app/api/features/calibration/services \
            backend/src/app/api/features/detection/domain \
            backend/src/app/api/features/detection/services)
          export TRACKER_VERSION
          export BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))
          docker compose up -d --build --wait
