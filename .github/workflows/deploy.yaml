name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cv: ${{ steps.diff.outputs.cv }}
    env:
      # Everything the photo replays run through, and the tests that drive them.
      CV_TEST_PATHS: >-
        backend/src/app/api/features/calibration
        backend/src/app/api/features/detection
        backend/src/app/api/features/evaluation
        backend/src/app/api/core/socket
        backend/tests/conftest.py
        backend/tests/cv
        backend/tests/api/conftest.py
        backend/tests/api/support.py
        backend/tests/api/test_socket.py
        backend/pyproject.toml
        backend/uv.lock
        .github/workflows/deploy.yaml
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether the push touches the CV pipeline
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run, a new branch or a force push has no previous commit to compare with.
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "cv=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- $CV_TEST_PATHS; then
            echo "cv=false" >> "$GITHUB_OUTPUT"
          else
            echo "cv=true" >> "$GITHUB_OUTPUT"
          fi

  test-cv:
    needs: changes
    if: needs.changes.outputs.cv == 'true'
    runs-on: [self-hosted, rpi5]
    timeout-minutes: 30
    services:
      # Published off the usual ports so they never meet the running stack.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dart
          POSTGRES_PASSWORD: dart
          POSTGRES_DB: dart_test
        ports: ["10032:5432"]
        options: >-
          --health-cmd "pg_isready -U dart -d dart_test"
          --health-interval 2s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["10033:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TESTDATA_DIR: /srv/dart-tracking/testdata
      POSTGRES_USER: dart
      POSTGRES_PASSWORD: dart
      POSTGRES_DB: dart_test
      POSTGRES_PORT: 10032
      REDIS_PORT: 10033
      JWT_SECRET: test-only-secret-padded-to-32-bytes
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/cv
      - run: uv run pytest tests/api -m dataset

  deploy:
    needs: [test, changes, test-cv]
    # A skipped test-cv means the push left the CV pipeline alone, not that it failed.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.test.result == 'success' && needs.changes.result == 'success'
      && (needs.test-cv.result == 'success' || needs.test-cv.result == 'skipped')
    runs-on: [self-hosted, rpi5]
    outputs:
      tracker-changed: ${{ steps.changes.outputs.tracker }}
    env:
      TESTDATA_DIR: /srv/dart-tracking/testdata
      TRACKER_PATHS: >-
        backend/src/app/api/features/calibration/domain
        backend/src/app/api/features/calibration/services
        backend/src/app/api/features/detection/domain
        backend/src/app/api/features/detection/services
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      APP_URL: https://darts.zorphy.net
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tracker version counts commits over the whole history
      - name: Check whether the push touches the tracker
        id: changes
        run: |
          if git diff --quiet ${{ github.event.before }} HEAD -- $TRACKER_PATHS backend/tests/cv backend/uv.lock; then
            echo "tracker=false" >> "$GITHUB_OUTPUT"
          else
            echo "tracker=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and start the stack
        run: |
          export TRACKER_VERSION=$(git rev-list --count HEAD -- $TRACKER_PATHS)
          export BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))
          docker compose up -d --build --wait

  cv-dataset:
    needs: deploy
    if: needs.deploy.outputs.tracker-changed == 'true'
    uses: ./.github/workflows/cv-dataset.yaml
