name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  test-cv:
    runs-on: [self-hosted, rpi5]
    timeout-minutes: 30
    env:
      TESTDATA_DIR: /srv/dart-tracking/testdata
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/cv

  deploy:
    needs: [test, test-cv]
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, rpi5]
    env:
      TESTDATA_DIR: /srv/dart-tracking/testdata
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      APP_URL: https://darts.zorphy.net
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tracker version counts commits over the whole history
      - name: Build and start the stack
        run: |
          # Tracker version: commits that changed the calibration or detection pipeline.
          TRACKER_VERSION=$(git rev-list --count HEAD -- \
            backend/src/app/api/features/calibration/domain \
            backend/src/app/api/features/calibration/services \
            backend/src/app/api/features/detection/domain \
            backend/src/app/api/features/detection/services)
          export TRACKER_VERSION
          export BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))
          docker compose up -d --build --wait
