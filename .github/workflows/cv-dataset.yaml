name: CV dataset

on:
  workflow_call: # from deploy.yaml when a push touches the tracker
  workflow_dispatch:
    inputs:
      update-baseline:
        description: Write a new baseline from the whole dataset and upload it as an artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dataset:
    name: CV dataset run
    runs-on: [self-hosted, rpi5]
    timeout-minutes: 180
    env:
      TESTDATA_DIR: /srv/dart-tracking/testdata
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the backend dependencies
        run: uv sync --frozen
      - name: Replay the whole dataset through the CV pipeline
        run: uv run pytest tests/cv --cv-set dataset ${{ inputs.update-baseline && '--update-baseline' || '' }}
      - name: Upload the new baseline
        if: inputs.update-baseline
        uses: actions/upload-artifact@v6
        with:
          name: cv-baseline
          path: backend/tests/cv/baseline_*.json
